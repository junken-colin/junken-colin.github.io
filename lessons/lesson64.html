  <h1>Lesson 64 — The Channel Tunnel</h1>
  <p class="sub">新概念英语 第二册</p>

  <div class="voice-bar">
    <label>发音：</label>

  <p class="stitle">课文原文</p>
  <p class="hint">点击任意单词查看释义、语法和发音</p>
  <div class="passage" data-sentences="In 1858, a French engineer, Aimé Thomé de Gamond, arrived in England with a plan for a twenty-one-mile tunnel under the English Channel.|He said that it would be possible to build a platform in the centre of the Channel.|This platform would serve as a port and a railway station.|The tunnel would be well-ventilated if tall chimneys were built above sea level.|In 1860, a better plan was put forward by an Englishman, William Low.|He suggested that a double railway tunnel should be built.|This would solve the problem of ventilation,for if a train entered this tunnel, it would draw in fresh air behind it.|Forty-two years later a tunnel was actually begun.|If,at the time, the British had not feared invasion, it would have been completed.|The world had to wait almost another 100 years for the Channel Tunnel.|It was officially opened on March 7,1994,finally connecting Britain to the European continent."></div>

  <details open>
    <summary>简单句口语复述</summary>
    <div class="dc" data-sentences="In 1858 a French engineer planned a tunnel under the English Channel with a platform serving as port and station, and in 1860 an Englishman suggested twin railway tunnels to solve ventilation.|Work actually began forty-two years later, but fear of invasion stopped it.|Only on March 7, 1994 was the Channel Tunnel finally opened, joining Britain to Europe."></div>
  </details>

  <details open>
    <summary>扩展口语问答参考</summary>
    <div class="dc">
      <div class="qa">
        <p class="q" data-sentences="Have you ever travelled through a tunnel?"></p>
        <p class="a" data-sentences="Yes, I went through the Channel Tunnel.|It connects England and France.|The train was fast and comfortable.|It was an amazing engineering feat."></p>
      </div>
      <div class="qa">
        <p class="q" data-sentences="Do you like long tunnels?"></p>
        <p class="a" data-sentences="They can feel a bit claustrophobic.|But modern tunnels are well-lit and safe.|They save a lot of travel time.|Engineering makes them possible."></p>
      </div>
      <div class="qa">
        <p class="q" data-sentences="What do you think about underwater tunnels?"></p>
        <p class="a" data-sentences="They are engineering marvels.|Building underwater is very challenging.|But they connect places effectively.|I'd be curious to travel through one."></p>
      </div>

const hlWords = new Set(["french", "engineer", "aim", "thom", "gamond", "arrived", "england", "plan", "mile", "tunnel", "english", "channel", "possible", "build", "platform", "centre", "serve", "port", "railway", "station", "ventilated", "tall", "chimneys", "built"]);

const tooltip = document.getElementById("tooltip");
const nceRoot = document.getElementById("nceRoot");
const voiceSelect = document.getElementById("voiceSelect");
const testBtn = document.getElementById("testVoice");

let voices = [];
let selectedVoice = null;

function loadVoices() {
  voices = window.speechSynthesis.getVoices();
  if (voices.length === 0) return;
  const enVoices = voices.filter(v => v.lang.startsWith('en'));
  voiceSelect.innerHTML = '';
  const groups = { 'US': [], 'UK': [], 'Other': [] };
  enVoices.forEach(v => {
    const name = v.name.toLowerCase();
    if (name.includes('us') || name.includes('american') || v.lang === 'en-US') groups['US'].push(v);
    else if (name.includes('uk') || name.includes('british') || v.lang === 'en-GB') groups['UK'].push(v);
    else groups['Other'].push(v);
  });
  const preferUS = ['Samantha', 'Alex', 'Tom'];
  const preferUK = ['Daniel', 'Kate', 'Serena'];
  function sortVoices(list, pref) {
    return list.sort((a, b) => {
      const ai = pref.findIndex(p => a.name.includes(p));
      const bi = pref.findIndex(p => b.name.includes(p));
      if (ai !== -1 && bi === -1) return -1;
      if (ai === -1 && bi !== -1) return 1;
      if (ai !== -1 && bi !== -1) return ai - bi;
      return a.name.localeCompare(b.name);
    });
  }
  groups['US'] = sortVoices(groups['US'], preferUS);
  groups['UK'] = sortVoices(groups['UK'], preferUK);
  if (groups['US'].length > 0) {
    const og = document.createElement('optgroup');
    og.label = '🇺🇸 美式发音';
    groups['US'].forEach((v, i) => {
      const opt = document.createElement('option');
      opt.value = voices.indexOf(v);
      opt.textContent = v.name;
      if (i === 0 && !selectedVoice) { selectedVoice = v; opt.selected = true; }
      og.appendChild(opt);
    });
    voiceSelect.appendChild(og);
  }
  if (groups['UK'].length > 0) {
    const og = document.createElement('optgroup');
    og.label = '🇬🇧 英式发音';
    groups['UK'].forEach((v, i) => {
      const opt = document.createElement('option');
      opt.value = voices.indexOf(v);
      opt.textContent = v.name;
      og.appendChild(opt);
    });
    voiceSelect.appendChild(og);
  }
  if (groups['Other'].length > 0) {
    const og = document.createElement('optgroup');
    og.label = '其他';
    groups['Other'].forEach(v => {
      const opt = document.createElement('option');
      opt.value = voices.indexOf(v);
      opt.textContent = v.name;
      og.appendChild(opt);
    });
    voiceSelect.appendChild(og);
  }
}

loadVoices();
if (typeof speechSynthesis !== 'undefined') speechSynthesis.onvoiceschanged = loadVoices;

voiceSelect.addEventListener('change', () => { selectedVoice = voices[parseInt(voiceSelect.value)]; });
testBtn.addEventListener('click', () => {
  if (!selectedVoice) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance('Hello, this is a test.');
  u.voice = selectedVoice; u.lang = selectedVoice.lang;
  u.rate = 1.0; u.pitch = 1.0; u.volume = 1.0;
  window.speechSynthesis.speak(u);
});

function wrapSentences(el) {
  const data = el.getAttribute("data-sentences");
  if (!data) return;
  const sentences = data.split("|");
  let html = "";
  sentences.forEach((s, si) => {
    const tokens = s.match(/[\w']+|[^\w']+/g) || [];
    for (const tok of tokens) {
      if (/^[\w']+$/.test(tok)) {
        const lower = tok.toLowerCase();
        const isHl = hlWords.has(lower);
        html += `<span class="w${isHl ? ' hl' : ''}" data-word="${lower}" data-sentence="${encodeURIComponent(s)}">${tok}</span>`;
      } else html += tok;
    }
    if (si < sentences.length - 1) html += " ";
  });
  el.innerHTML = html;
}

document.querySelectorAll("[data-sentences]").forEach(wrapSentences);

function speak(word, el) {
  if (!('speechSynthesis' in window) || !selectedVoice) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(word);
  u.voice = selectedVoice; u.lang = selectedVoice.lang;
  u.rate = 1.0; u.pitch = 1.0; u.volume = 1.0;
  el.classList.add("speaking");
  u.onend = () => el.classList.remove("speaking");
  u.onerror = () => el.classList.remove("speaking");
  window.speechSynthesis.speak(u);
}

function showTip(el, word) {
  const info = dict[word];
  const rect = el.getBoundingClientRect();
  let grammarText = info && info.grammar ? info.grammar : "暂无语法解释";
  if (info) {
    tooltip.innerHTML = `<span class="tw">${word}</span><span class="tp">${info.pos}</span>${(info.us || info.uk) ? `<span class="tph">/${info.us || info.uk}/</span>` : ""}<div class="tm">${info.meaning}</div><div class="tg">📖 ${grammarText}</div><div class="spk-row"><span class="spk" data-word="${word}">🔊 美${info.us ? " " + info.us : ""}</span><span class="spk" data-word="${word}" data-accent="uk">🔊 英${(info.uk || info.us) ? " " + (info.uk || info.us) : ""}</span></div>`;
  } else {
    tooltip.innerHTML = `<span class="tw">${word}</span><div class="tg">📖 ${grammarText}</div><div class="spk-row"><span class="spk" data-word="${word}">🔊 美式</span><span class="spk" data-word="${word}" data-accent="uk">🔊 英式</span></div>`;
  }
  let left = rect.left + rect.width / 2;
  let top = rect.bottom + 6;
  tooltip.style.left = left + "px";
  tooltip.style.top = top + "px";
  tooltip.style.transform = "translateX(-50%)";
  tooltip.classList.add("show");
  requestAnimationFrame(() => {
    const tr = tooltip.getBoundingClientRect();
    if (tr.left < 8) tooltip.style.left = (left + (8 - tr.left)) + "px";
    else if (tr.right > window.innerWidth - 8) tooltip.style.left = (left - (tr.right - window.innerWidth + 8)) + "px";
    if (tr.bottom > window.innerHeight - 8) tooltip.style.top = (rect.top - tr.height - 6) + "px";
  });
}

let activeWord = null;
nceRoot.addEventListener("click", (e) => {
  const spkBtn = e.target.closest(".spk");
  if (spkBtn) {
    e.stopPropagation();
    const word = spkBtn.dataset.word;
    const isUK = spkBtn.dataset.accent === "uk";
    let voice = selectedVoice;
    if (voices.length > 0) {
      const targetLang = isUK ? 'en-GB' : 'en-US';
      const found = voices.find(v => v.lang === targetLang);
      if (found) voice = found;
    }
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(word);
    u.voice = voice; u.lang = voice.lang;
    u.rate = 1.0; u.pitch = 1.0; u.volume = 1.0;
    spkBtn.classList.add("playing");
    u.onend = () => spkBtn.classList.remove("playing");
    u.onerror = () => spkBtn.classList.remove("playing");
    window.speechSynthesis.speak(u);
    return;
  }
  const el = e.target.closest(".w");
  if (!el) { tooltip.classList.remove("show"); activeWord = null; return; }
  const word = el.dataset.word;
  if (activeWord === el) { tooltip.classList.remove("show"); activeWord = null; return; }
  activeWord = el;
  showTip(el, word);
  speak(word, el);
});
document.addEventListener("click", (e) => {
  if (!nceRoot.contains(e.target)) { tooltip.classList.remove("show"); activeWord = null; }
});
</script>
