const hlWords = new Set(["theatre", "seat", "interesting", "sitting", "loudly", "turned", "round", "angrily", "pay", "any", "attention", "disturbing", "conversation"]);

const tooltip = document.getElementById("tooltip");

const voiceSelect = document.getElementById("voiceSelect");
const testBtn = document.getElementById("testVoice");

let voices = [];
let selectedVoice = null;

function loadVoices() {
  voices = window.speechSynthesis.getVoices();
  if (voices.length === 0) return;
  
  // Filter for English voices
  const enVoices = voices.filter(v => v.lang.startsWith('en'));
  
  voiceSelect.innerHTML = '';
  
  // Group by accent
  const groups = { 'US': [], 'UK': [], 'Other': [] };
  enVoices.forEach(v => {
    const name = v.name.toLowerCase();
    if (name.includes('us') || name.includes('american') || v.lang === 'en-US') {
      groups['US'].push(v);
    } else if (name.includes('uk') || name.includes('british') || v.lang === 'en-GB') {
      groups['UK'].push(v);
    } else {
      groups['Other'].push(v);
    }
  });
  
  // Prefer high-quality voices
  const preferUS = ['Samantha', 'Alex', 'Tom', 'Karen', 'Moira'];
  const preferUK = ['Daniel', 'Kate', 'Serena', 'Oliver', 'Fiona'];
  
  function sortVoices(voiceList, preferred) {
    return voiceList.sort((a, b) => {
      const aIdx = preferred.findIndex(p => a.name.includes(p));
      const bIdx = preferred.findIndex(p => b.name.includes(p));
      if (aIdx !== -1 && bIdx === -1) return -1;
      if (aIdx === -1 && bIdx !== -1) return 1;
      if (aIdx !== -1 && bIdx !== -1) return aIdx - bIdx;
      return a.name.localeCompare(b.name);
    });
  }
  
  groups['US'] = sortVoices(groups['US'], preferUS);
  groups['UK'] = sortVoices(groups['UK'], preferUK);
  
  // Add options
  if (groups['US'].length > 0) {
    const optgroup = document.createElement('optgroup');
    optgroup.label = '🇺🇸 美式发音';
    groups['US'].forEach((v, i) => {
      const opt = document.createElement('option');
      opt.value = voices.indexOf(v);
      opt.textContent = v.name;
      if (i === 0 && !selectedVoice) {
        selectedVoice = v;
        opt.selected = true;
      }
      optgroup.appendChild(opt);
    });
    voiceSelect.appendChild(optgroup);
  }
  
  if (groups['UK'].length > 0) {
    const optgroup = document.createElement('optgroup');
    optgroup.label = '🇬🇧 英式发音';
    groups['UK'].forEach((v, i) => {
      const opt = document.createElement('option');
      opt.value = voices.indexOf(v);
      opt.textContent = v.name;
      optgroup.appendChild(opt);
    });
    voiceSelect.appendChild(optgroup);
  }
  
  if (groups['Other'].length > 0) {
    const optgroup = document.createElement('optgroup');
    optgroup.label = '其他';
    groups['Other'].forEach(v => {
      const opt = document.createElement('option');
      opt.value = voices.indexOf(v);
      opt.textContent = v.name;
      optgroup.appendChild(opt);
    });
    voiceSelect.appendChild(optgroup);
  }
}

// Load voices
loadVoices();
if (typeof speechSynthesis !== 'undefined') {
  speechSynthesis.onvoiceschanged = loadVoices;
}

voiceSelect.addEventListener('change', () => {
  const idx = parseInt(voiceSelect.value);
  selectedVoice = voices[idx];
});

testBtn.addEventListener('click', () => {
  if (!selectedVoice) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance('Hello, this is a test.');
  utter.voice = selectedVoice;
  utter.lang = selectedVoice.lang;
  utter.rate = 1.0;
  utter.pitch = 1.0;
  utter.volume = 1.0;
  window.speechSynthesis.speak(utter);
});

function wrapText(el) {
  const text = el.getAttribute("data-text");
  if (!text) return;
  
  const tokens = text.match(/[\w']+|[^\w']+/g) || [];
  let html = "";
  for (const tok of tokens) {
    if (/^[\w']+$/.test(tok)) {
      const lower = tok.toLowerCase();
      const isHl = hlWords.has(lower);
      html += `<span class="w${isHl ? ' hl' : ''}" data-word="${lower}">${tok}</span>`;
    } else {
      html += tok;
    }
  }
  el.innerHTML = html;
}

document.querySelectorAll("[data-text]").forEach(wrapText);

function speak(word, el) {
  if (!('speechSynthesis' in window) || !selectedVoice) return;
  
  window.speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(word);
  utterance.voice = selectedVoice;
  utterance.lang = selectedVoice.lang;
  utterance.rate = 1.0;
  utterance.pitch = 1.0;
  utterance.volume = 1.0;
  
  el.classList.add("speaking");
  utterance.onend = () => el.classList.remove("speaking");
  utterance.onerror = () => el.classList.remove("speaking");
  
  window.speechSynthesis.speak(utterance);
}

function showTip(el, word) {
  const info = dict[word];
  const rect = el.getBoundingClientRect();
  
  if (info) {
    tooltip.innerHTML = `<span class="tw">${word}</span><span class="tp">${info.pos}</span><div class="tm">${info.meaning}</div><div class="spk-row"><span class="spk" data-word="${word}">🔊 美式</span><span class="spk" data-word="${word}" data-accent="uk">🔊 英式</span></div>`;
  } else {
    tooltip.innerHTML = `<span class="tw">${word}</span><div class="spk-row"><span class="spk" data-word="${word}">🔊 美式</span><span class="spk" data-word="${word}" data-accent="uk">🔊 英式</span></div>`;
  }
  
  let left = rect.left + rect.width / 2;
  let top = rect.bottom + 6;
  
  tooltip.style.left = left + "px";
  tooltip.style.top = top + "px";
  tooltip.style.transform = "translateX(-50%)";
  tooltip.classList.add("show");
  
  requestAnimationFrame(() => {
    const tipRect = tooltip.getBoundingClientRect();
    if (tipRect.left < 8) {
      tooltip.style.left = (left + (8 - tipRect.left)) + "px";
    } else if (tipRect.right > window.innerWidth - 8) {
      tooltip.style.left = (left - (tipRect.right - window.innerWidth + 8)) + "px";
    }
    if (tipRect.bottom > window.innerHeight - 8) {
      tooltip.style.top = (rect.top - tipRect.height - 6) + "px";
    }
  });
}

    // Find appropriate voice
    let voice = selectedVoice;
    if (voices.length > 0) {
      const targetLang = isUK ? 'en-GB' : 'en-US';
      const found = voices.find(v => v.lang === targetLang);
      if (found) voice = found;
    }
    
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(word);
    utter.voice = voice;
    utter.lang = voice.lang;
    utter.rate = 1.0;
    utter.pitch = 1.0;
    utter.volume = 1.0;
    
    spkBtn.classList.add("playing");
    utter.onend = () => spkBtn.classList.remove("playing");
    utter.onerror = () => spkBtn.classList.remove("playing");
    
    window.speechSynthesis.speak(utter);
    return;
  }
  
  const el = e.target.closest(".w");
  if (!el) {
    tooltip.classList.remove("show");
    activeWord = null;
    return;
  }
  
  const word = el.dataset.word;
  
  if (activeWord === el) {
    tooltip.classList.remove("show");
    activeWord = null;
    return;
  }
  
  activeWord = el;
  showTip(el, word);
  speak(word, el);
});

document.addEventListener("click", (e) => {
  if (!nceRoot.contains(e.target)) {
    tooltip.classList.remove("show");
    activeWord = null;
  }
});
</script>
